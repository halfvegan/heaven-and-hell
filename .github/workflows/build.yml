# Builds the mod on every push. The finished .jar is attached to each run
# (Actions tab -> latest run -> Artifacts) and also saved on the "ci/build" branch.
name: build
on:
  push:
    branches-ignore:
      - 'ci/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: set up minecraft
        id: setup
        run: |
          mkdir -p ci-out
          set -o pipefail
          ./gradlew hhExportClasspath --stacktrace 2>&1 | tee ci-out/setup.log
      - name: look up Minecraft class signatures
        if: steps.setup.outcome == 'success' && hashFiles('.github/javap-packages.txt') != ''
        continue-on-error: true
        run: bash .github/javap.sh
      - name: compile and package
        id: assemble
        if: steps.setup.outcome == 'success'
        run: |
          set -o pipefail
          ./gradlew assemble --stacktrace 2>&1 | tee ci-out/build.log
      - name: server game tests
        id: gametest
        if: steps.assemble.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew runGameTest --stacktrace 2>&1 | tee ci-out/gametest.log
      - name: collect results
        if: always()
        run: |
          mkdir -p ci-out/jar
          cp build/libs/*.jar ci-out/jar/ 2>/dev/null || true
          rm -f ci-out/jar/*-sources.jar
          cp build/run/gameTest/logs/latest.log ci-out/gametest-latest.log 2>/dev/null || true
          cp -r build/run/gameTest/crash-reports ci-out/ 2>/dev/null || true
          echo "setup=${{ steps.setup.outcome }} assemble=${{ steps.assemble.outcome }} gametest=${{ steps.gametest.outcome }} sha=${{ github.sha }}" > ci-out/status.txt
      - name: upload mod jar
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: heaven-and-hell-mod
          path: ci-out/jar/
      - name: publish results branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/publish.sh build

  client_test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x ./gradlew
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - name: prepare client run directory
        run: |
          mkdir -p build/run/clientGameTest ci-out
          echo "eula=true" > build/run/clientGameTest/eula.txt
          printf 'version:5023\nonboardAccessibility:false\npreferredGraphicsBackend:"opengl"\nrenderDistance:10\nsimulationDistance:8\nguiScale:2\n' > build/run/clientGameTest/options.txt
      - name: client game tests (screenshots)
        id: clienttest
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew runClientGameTest --stacktrace 2>&1 | tee ci-out/clienttest.log
      - name: collect results
        if: always()
        run: |
          cp -r build/run/clientGameTest/screenshots ci-out/ 2>/dev/null || true
          cp build/run/clientGameTest/logs/latest.log ci-out/client-latest.log 2>/dev/null || true
          cp -r build/run/clientGameTest/crash-reports ci-out/ 2>/dev/null || true
          echo "clienttest=${{ steps.clienttest.outcome }} sha=${{ github.sha }}" > ci-out/status.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-screenshots
          path: ci-out/
      - name: publish results branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/publish.sh client
